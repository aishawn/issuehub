services:
  teamai:
    build: .
    ports:
      - "${TEAMAI_BIND_ADDRESS:-127.0.0.1}:8787:8787"
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set an encoded PostgreSQL DATABASE_URL in .env}
      APP_HOST: 0.0.0.0
      APP_PORT: "8787"
      SYNC_INTERVAL_SECONDS: "60"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-teamai}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - teamai-objects:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      mc alias set teamai http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
      mc mb --ignore-existing teamai/$${ATTACHMENT_BUCKET} &&
      mc anonymous set none teamai/$${ATTACHMENT_BUCKET}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-teamai}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      ATTACHMENT_BUCKET: ${ATTACHMENT_BUCKET:-teamai-attachments}
    restart: "no"
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-teamai}
      POSTGRES_USER: ${POSTGRES_USER:-teamai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - teamai-postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-teamai} -d ${POSTGRES_DB:-teamai}"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  teamai-postgres:
  teamai-objects:
