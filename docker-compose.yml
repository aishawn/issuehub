services:
  teamai:
    build: .
    ports:
      - "${TEAMAI_BIND_ADDRESS:-127.0.0.1}:8787:8787"
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DB: /data/teamai.db
      APP_HOST: 0.0.0.0
      APP_PORT: "8787"
      SYNC_INTERVAL_SECONDS: "60"
    volumes:
      - teamai-data:/data
      - teamai-backups:/backups
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  teamai-data:
  teamai-backups:
